<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040914">
<title>Oazy · Training</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="visual.css">
</head>
<body>
<header class="vtop"><div class="vtop-in">
  <a class="vmark" href="./" aria-label="Oazy training"><img src="icon.svg" alt=""><span>OAZY<small>training</small></span></a>
  <span class="pill" id="pulse"><span class="dot"></span><span>connecting…</span></span>
  <nav class="vlinks"><a href="world">World</a><a href="classic">Details</a></nav>
</div></header>

<main class="vwrap">
  <section id="now" aria-label="Training now"></section>
  <section id="worldNow" aria-label="World races" hidden></section>

  <section class="vsec" id="race" aria-label="The race">
    <div class="vsec-h"><h2 id="raceTitle">The race</h2><button class="vlink" id="raceReset" hidden>back to the race</button></div>
    <div class="vlegend" id="legend"></div>
    <div class="vcharts">
      <figure class="card vchart"><figcaption><b>Held-out loss</b><span>lower is better</span></figcaption><div class="vplot" id="cLoss"></div></figure>
      <figure class="card vchart"><figcaption><b>HellaSwag</b><span>higher is better</span></figcaption><div class="vplot" id="cHs"></div></figure>
      <figure class="card vchart"><figcaption><b>LogT</b><span>reasoning puzzles</span></figcaption><div class="vplot" id="cLogt"></div></figure>
      <figure class="card vchart"><figcaption><b>World exams</b><span>secret questions, never practised</span></figcaption><div class="vplot" id="cWorld"></div></figure>
    </div>
  </section>

  <section class="vsec" id="all" aria-label="Every run">
    <div class="vsec-h"><h2>Every run</h2>
      <div class="seg" id="filter"><button data-f="all" class="on">All</button><button data-f="done">Finished</button><button data-f="stopped">Stopped</button></div></div>
    <p class="vhint">Tap a run to add it to the charts, or take it out.</p>
    <div class="vtiles" id="tiles"></div>
  </section>
</main>

<footer class="vfoot"><span id="ver"></span><span>refreshes every 15 s</span></footer>
<div class="vtip" id="tip" hidden></div>

<script src="visual.js"></script>
</body>
</html>
