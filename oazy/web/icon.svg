<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Oazy mark (same family as the Oazy launcher icon): open ring with an orbiting dot on an indigo-violet squircle -->
  <defs>
    <linearGradient id="oz-bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0e1028"/>
      <stop offset="0.55" stop-color="#3c2fa8"/>
      <stop offset="0.8" stop-color="#4c34d6"/>
      <stop offset="1" stop-color="#ec5cb2"/>
    </linearGradient>
    <radialGradient id="oz-glow" cx="0.82" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#78c8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78c8ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="oz-sq"><rect width="100" height="100" rx="23"/></clipPath>
  </defs>
  <g clip-path="url(#oz-sq)">
    <rect width="100" height="100" fill="url(#oz-bg)"/>
    <rect width="100" height="100" fill="url(#oz-glow)"/>
  </g>
  <path d="M67.41 40.81 A21.25 21.25 0 1 1 48.15 31.83" fill="none" stroke="#fff" stroke-width="8.5" stroke-linecap="round"/>
  <circle cx="62.21" cy="30.03" r="6.2" fill="#fff"/>
</svg>
