<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Oazy mark: a liquid-glass spark drawn as a small network (nodes at the tips, a hub at the centre) -->
  <defs><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0a2a80" flood-opacity="0.45"/></filter>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="st" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#b6f8ff"/><stop offset="0.45" stop-color="#3cc0ff"/><stop offset="0.8" stop-color="#2a6cff"/><stop offset="1" stop-color="#8a5cff"/></linearGradient>
    <linearGradient id="st2" x1="0.8" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#a6ffe0"/><stop offset="1" stop-color="#1fb8a0"/></linearGradient>
    <radialGradient id="node" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#fff"/><stop offset="0.5" stop-color="#dffaff"/><stop offset="1" stop-color="#7fe0ff"/></radialGradient>
    <radialGradient id="hub" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#fff"/><stop offset="0.45" stop-color="#7fe6ff"/><stop offset="1" stop-color="#2a6cff"/></radialGradient>
  </defs>
  <path d="M50 10 C53 36 64 47 90 50 C64 53 53 64 50 90 C47 64 36 53 10 50 C36 47 47 36 50 10 Z" fill="url(#st)" fill-opacity="0.28" stroke="url(#st)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M50 10 C53 36 64 47 90 50 C64 53 53 64 50 90 C47 64 36 53 10 50 C36 47 47 36 50 10 Z" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="1.2"/>
  <g stroke="#bff4ff" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"><path d="M50 18 V42 M50 58 V82 M18 50 H42 M58 50 H82"/></g>
  <g filter="url(#sh)">
    <circle cx="50" cy="10" r="6" fill="url(#node)"/><circle cx="90" cy="50" r="6" fill="url(#node)"/><circle cx="50" cy="90" r="6" fill="url(#node)"/><circle cx="10" cy="50" r="6" fill="url(#node)"/>
    <circle cx="50" cy="50" r="10" fill="url(#hub)"/>
  </g>
  <ellipse cx="47" cy="45.5" rx="5" ry="3" fill="#fff" fill-opacity="0.8"/>
</svg>
